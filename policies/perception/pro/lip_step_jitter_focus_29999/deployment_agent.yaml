seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 9000
empirical_normalization: {}
obs_groups:
  policy:
  - policy
  critic:
  - critic
  discriminator:
  - disc
  discriminator_demonstration:
  - disc_demo
clip_actions: null
check_for_nan: true
save_interval: 500
experiment_name: aiq11_pro_parkour
run_name: lip_perception_step_jitter_focus_resume21000_convex_4096
logger: tensorboard
neptune_project: isaaclab
wandb_project: aiq11_pro_parkour
resume: true
load_run: 2026-10-12_01-49-32_lip_perception_step_jitter_focus_resume21000_convex_4096
load_checkpoint: model_21000.pt
class_name: AMPRunner
actor: {}
critic: {}
algorithm:
  class_name: PPOAMP
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.006
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  amp_cfg:
    disc_obs_buffer_size: 100
    grad_penalty_scale: 5.0
    disc_trunk_weight_decay: 0.0001
    disc_linear_weight_decay: 0.01
    disc_learning_rate: 0.0001
    disc_max_grad_norm: 1.0
    amp_discriminator:
      hidden_dims:
      - 1024
      - 512
      activation: ReLU
      style_reward_scale: 2.0
      task_style_lerp: 0.3
    loss_type: LSGAN
policy:
  class_name: EncoderMoEActorCritic
  init_noise_std: 1.0
  noise_std_type: log
  num_moe_experts: 5
  moe_gate_hidden_dims: []
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 256
  - 128
  - 64
  actor_obs_normalization: false
  critic_obs_normalization: false
  activation: elu
  actor_encoder_obs_groups:
  - depth_image
  critic_encoder_obs_groups:
  - depth_image
  encoder_cfg:
    channels:
    - 4
    kernel_sizes:
    - 3
    strides:
    - 1
    hidden_sizes:
    - 256
    - 256
    output_size: 128
    paddings:
    - 1
    nonlinearity: ReLU
    use_maxpool: true
    last_activation: ReLU
  encoder_onnx_stems:
    depth_image: depth_encoder
  encoder_onnx_sequential_idx: 0
