# sim2sim(2).zip policy: 624 proprioception + 4608 depth -> 23 actions.
# The archive's AIQ11_PRO is a 23-joint logical model. This overlay runs with
# the workspace Sport mapping and retains its physical closed-chain mechanisms.
# Ankle override: joint leg_5/6 Kd is zero; HYBRID_MODE motor Kd is 3.0.
# Previous-action history alone is clipped to [-10,10]; output scale is 0.25.
/**/main_controller:
  ros__parameters:
    perception_walk_enabled: true
    perception_depth_publish_enabled: true
    RL_PERCEPTION_WALK_profile_id: perception_walk
    RL_PERCEPTION_WALK_policy_joint_layout: aiq11_23
    RL_PERCEPTION_WALK_policy_path: config/perception_walk/pro/perception_policy.pt
    RL_PERCEPTION_WALK_manifest_path: config/perception_walk/pro/perception_policy.manifest.json
    RL_PERCEPTION_WALK_dtype: float32
    RL_PERCEPTION_WALK_obs_dim: 5232
    RL_PERCEPTION_WALK_obs_his_length: 8
    RL_PERCEPTION_WALK_obs_flatten: true
    RL_PERCEPTION_WALK_action_dim: 23
    RL_PERCEPTION_WALK_action_his_length: 1
    RL_PERCEPTION_WALK_step_dt: 0.02
    RL_PERCEPTION_WALK_enable_preemptive_infer: false
    RL_PERCEPTION_WALK_output_mode: HYBRID_MODE
    RL_PERCEPTION_WALK_depth_topic: /perception/depth_stack
    RL_PERCEPTION_WALK_preprocessing_version: parkour_depth_v2
    RL_PERCEPTION_WALK_fixed_depth_test_enabled: false
    RL_PERCEPTION_WALK_fixed_depth_test_m: 0.6
    RL_PERCEPTION_WALK_depth_timeout: 0.1
    RL_PERCEPTION_WALK_inference_timeout: 0.018
    # torch CPU intra-op 线程数（**进程级**时序策略，唯一入口 locomotion/torch_threading.h；
    # 与 FlowMimic 共用：inter-op 全进程只设置一次，intra-op「更严格（更小）者胜」）。
    # 默认 1 的依据：batch=1 前向数值**位级一致**（40 组真实输入 × 23 维，max|Δ|=0），
    # 极端超订（loadavg 43.79）下每周期工作量 p50 2.5 ms / max 4.0 ms（= 0.20 × 20 ms）。
    # <=0 = 合法但**不设置**（保持现状，仅诊断/逃生用途）；更大值在 FlowMimic 启用时会被收紧为 1。
    RL_PERCEPTION_WALK_intra_op_threads: 1

    RL_PERCEPTION_WALK_max_position_step: 10.0
    RL_PERCEPTION_WALK_hybrid_leg4_motor_kd: 0.0
    RL_PERCEPTION_WALK_hybrid_leg56_motor_kd: 3.0
    RL_PERCEPTION_WALK_hybrid_torso1_motor_kd: 0.0
    # Torso damping already comes from the policy joint-space Kd (3/5/5).
    RL_PERCEPTION_WALK_hybrid_torso23_motor_kd: 0.0
